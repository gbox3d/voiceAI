[project]
name = "whisper-example"
version = "0.1.0"
description = "STT research - Whisper model experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "torch>=2.0.0",
    "peft>=0.13.0",
    "datasets>=3.0.0",
    "rich>=14.3.2",
    "scipy>=1.17.0",
    "soundfile>=0.13.1",
    "faster-whisper>=1.0.0",
    "librosa>=0.11.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
model-downloader = "utils.download_model:main"
gpu-check = "utils.check_gpu:main"

# PyTorch CUDA 빌드를 받기 위한 인덱스 설정
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
